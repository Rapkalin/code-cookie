# =============================================================================
# code-cookie — vhost Apache du conteneur de développement.
#
# ⚠️ Les règles de réécriture et les en-têtes NE SONT PAS définis ici : ils
#    vivent dans `website/.htaccess`, source unique qui part avec le code.
#    C'est ce que `AllowOverride All` rend possible. Les dupliquer ici créerait
#    deux configurations à maintenir, qui divergeraient.
# =============================================================================
<VirtualHost *:80>
    # Le docroot est website/, pas la racine du projet : .env, composer.json et
    # scripts/ restent hors de portée d'Apache.
    DocumentRoot /var/www/html/website
    DirectoryIndex index.php index.html

    <Directory /var/www/html/website>
        Options FollowSymLinks
        # Indispensable : sans ça website/.htaccess est ignoré et les
        # permaliens renvoient des 404.
        AllowOverride All
        Require all granted
    </Directory>

    # Filet si AllowOverride venait à être restreint : la racine du projet
    # n'est de toute façon pas servie, on refuse explicitement.
    <Directory /var/www/html>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
